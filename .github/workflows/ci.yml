name: ci

on:
  push:
  pull_request:

jobs:
  # The vendorable core alone: numpy, pandas, scipy, matplotlib (+ httpx).
  # HF, torch and FAISS tests skip, which is the point: nothing in the core
  # may need them.
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[http,dev]"
      - run: ruff check .
      - run: mypy evalcore
      - run: pytest -q -W error::RuntimeWarning

  # Everything, including local models (CPU torch) and FAISS.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[http,hf,retrieval,dev]"
      - run: pytest -q -W error::RuntimeWarning
