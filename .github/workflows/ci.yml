name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"     # weekly: a new dependency release fails here, not on the next push

jobs:
  # The vendorable core alone: numpy, pandas, scipy, matplotlib (+ httpx).
  # HF, torch and FAISS tests skip, which is the point: nothing in the core
  # may need them.
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[http,dev]"
      - run: ruff check .
      - run: mypy evalcore
      - run: pytest -q -rs -W error::RuntimeWarning

  # Everything, including local models (CPU torch), FAISS and Ray, on the
  # oldest transformers the hf extra allows and on the newest release.
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["==4.57.*", ""]   # "" = the newest release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[http,hf,retrieval,ray,dev]" "transformers${{ matrix.transformers }}"
      - run: python -c "import transformers, ray; print('transformers', transformers.__version__, 'ray', ray.__version__)"
      - run: pytest -q -rs -W error::RuntimeWarning
